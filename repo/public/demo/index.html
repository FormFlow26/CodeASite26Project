<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormFlow Demo</title>
    <link rel="stylesheet" href="/demo/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <h1>FormFlow Demo</h1>
          <p>Live pose tracking with rep persistence and group alerts.</p>
        </div>
        <div class="topbar-actions">
          <button id="bootstrap-button" class="button button-secondary" type="button">Reset Demo Context</button>
          <button id="start-button" class="button" type="button">Start Session</button>
          <button id="stop-button" class="button button-secondary" type="button" disabled>Stop</button>
        </div>
      </section>

      <section class="layout">
        <section class="panel controls-panel">
          <h2>Session</h2>
          <form id="config-form" class="form-grid">
            <label>
              <span>User ID</span>
              <input id="user-id" name="userId" type="text" readonly />
            </label>
            <label>
              <span>Group ID</span>
              <input id="group-id" name="groupId" type="text" readonly />
            </label>
            <label>
              <span>Exercise</span>
              <select id="exercise-type" name="exerciseType">
                <option value="squat">Squat</option>
                <option value="deadlift">Deadlift</option>
                <option value="bench">Bench</option>
                <option value="ohp">Overhead Press</option>
              </select>
            </label>
            <label>
              <span>Target Sets</span>
              <input id="target-sets" name="targetSets" type="number" min="1" value="2" />
            </label>
            <label>
              <span>Reps per Set</span>
              <input id="reps-per-set" name="repsPerSet" type="number" min="1" value="4" />
            </label>
            <label>
              <span>Server URL</span>
              <input id="server-url" name="serverUrl" type="text" readonly />
            </label>
          </form>
        </section>

        <section class="panel video-panel">
          <div class="panel-header">
            <h2>Camera</h2>
            <div id="phase-badge" class="status-badge">Idle</div>
          </div>
          <div class="video-stage">
            <video id="formflow-video" autoplay playsinline muted></video>
          </div>
        </section>

        <section class="panel telemetry-panel">
          <div class="panel-header">
            <h2>Telemetry</h2>
            <div id="connection-status" class="status-badge">Booting</div>
          </div>
          <dl class="stats-grid">
            <div>
              <dt>Session</dt>
              <dd id="session-id">Pending</dd>
            </div>
            <div>
              <dt>Current Set</dt>
              <dd id="current-set">0</dd>
            </div>
            <div>
              <dt>Reps in Set</dt>
              <dd id="current-reps">0</dd>
            </div>
            <div>
              <dt>Total Score</dt>
              <dd id="total-score">0</dd>
            </div>
            <div>
              <dt>Avg Fluidity</dt>
              <dd id="average-fluidity">0</dd>
            </div>
            <div>
              <dt>Kinks</dt>
              <dd id="total-kinks">0</dd>
            </div>
          </dl>
          <div class="log-block">
            <div class="log-header">
              <h3>Status</h3>
              <span id="status-text">Preparing demo context</span>
            </div>
            <pre id="event-log" class="log-output"></pre>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="/demo/app.js"></script>
  </body>
</html>
